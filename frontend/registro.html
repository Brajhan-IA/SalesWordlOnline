<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Sales World Online</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="registro">
  <canvas id="estrellas"></canvas>
  <header class="encabezado" id="encabezado"></header>
  <main class="contenedor">
    <form class="formulario" id="form-registro" novalidate>
      <h2 class="titulo">Crear cuenta</h2>
      <p class="subtitulo">Únete a Sales World Online.</p>
      <div class="campo"><label for="nombre">Nombre completo</label>
        <input type="text" id="nombre"><div class="campo__mensaje"></div></div>
      <div class="campo"><label for="correo">Correo electrónico</label>
        <input type="email" id="correo"><div class="campo__mensaje"></div></div>
      <div class="campo"><label for="celular">Celular</label>
        <input type="tel" id="celular" maxlength="10"><div class="campo__mensaje"></div></div>
      <div class="campo"><label for="clave">Contraseña</label>
        <input type="password" id="clave"><div class="campo__mensaje"></div></div>
      <div class="campo"><label for="confirmacion">Confirmar contraseña</label>
        <input type="password" id="confirmacion"><div class="campo__mensaje"></div></div>
      <button class="boton" type="submit">Registrarme</button>
    </form>
  </main>
  <footer class="pie">Sales World Online © 2025 · Componente front-end · Brajhan Alejandro Jacome · SENA</footer>
  <div class="aviso" id="aviso"></div>
  <script src="js/datos.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
